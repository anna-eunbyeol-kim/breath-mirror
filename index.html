<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fogether</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/npm/pretendard@latest/dist/web/static/pretendard.css" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; width: 100vw; height: 100vh; height: 100dvh; cursor: none; }
  #container { position: relative; width: 100vw; height: 100vh; height: 100dvh; }
  video { position: absolute; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); opacity: 0; pointer-events: none; }
  canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  #cameraCanvas { z-index: 1; }
  #maskCanvas   { z-index: 0; display: none; }
  #blurCanvas   { z-index: 2; }
  #frameCanvas  { z-index: 3; pointer-events: none; }
  #fxCanvas     { z-index: 4; pointer-events: none; }

  #cursor {
    position: fixed; width: 20px; height: 20px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.7); background: rgba(255,255,255,0.08);
    pointer-events: none; z-index: 100; transform: translate(-50%, -50%);
    opacity: 0; transition: opacity 0.15s;
  }
  #cursor.drawing { background: rgba(255,255,255,0.9); border-color: #fff; }

  #breathRing {
    position: fixed; bottom: 110px; left: 50%; transform: translateX(-50%);
    width: 44px; height: 44px; border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,0.12); z-index: 50; pointer-events: none;
    transition: border-color 0.1s, box-shadow 0.1s;
  }
  #breathRing.active { border-color: rgba(210,225,235,0.9); box-shadow: 0 0 20px rgba(210,225,235,0.35); }

  #status {
    position: fixed; bottom: 164px; left: 50%; transform: translateX(-50%);
    color: rgba(255,255,255,0.4); font-size: 11px; letter-spacing: 0.18em;
    text-transform: uppercase; font-family: 'Pretendard', sans-serif; font-weight: 700;
    pointer-events: none; white-space: nowrap; z-index: 50;
  }

  #countdown {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    font-size: clamp(72px, 18vw, 140px); font-family: 'Pretendard', sans-serif; font-weight: 700;
    color: rgba(255,255,255,0.9); text-shadow: 0 0 40px rgba(255,255,255,0.4);
    pointer-events: none; z-index: 60; opacity: 0; transition: opacity 0.2s;
  }
  #countdown.show { opacity: 1; }

  #btnGroup { position: fixed; top: 20px; right: 20px; z-index: 50; display: flex; gap: 8px; }
  #btnGroup button {
    background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.4);
    color: rgba(255,255,255,0.9); padding: 8px 16px; font-size: 11px;
    letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer;
    border-radius: 4px; font-family: 'Pretendard', sans-serif; font-weight: 700; transition: all 0.15s;
    backdrop-filter: blur(6px);
  }
  #btnGroup button:hover { background: rgba(255,255,255,0.2); }
  #btnGroup button:active { transform: scale(0.96); }

  #photoStrip {
    position: fixed; bottom: 0; left: 0; right: 0; height: 80px;
    display: flex; align-items: center; gap: 8px; padding: 8px 16px;
    z-index: 55; overflow-x: auto;
    background: linear-gradient(to top, rgba(0,0,0,0.6), transparent);
  }
  #photoStrip::-webkit-scrollbar { display: none; }
  .photo-thumb {
    position: relative; flex-shrink: 0; height: 62px; border-radius: 4px;
    overflow: hidden; cursor: pointer;
    border: 1.5px solid rgba(255,255,255,0.25);
    transition: border-color 0.15s, transform 0.15s;
    animation: thumbIn 0.3s ease;
  }
  .photo-thumb:hover { border-color: rgba(255,255,255,0.8); transform: scale(1.05); }
  .photo-thumb img { height: 100%; display: block; }
  .save-btn {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.55); color: white; font-size: 10px;
    letter-spacing: 0.1em; font-family: 'Pretendard', sans-serif; font-weight: 700; text-transform: uppercase;
    opacity: 0; transition: opacity 0.15s;
  }
  .photo-thumb:hover .save-btn { opacity: 1; }
  @keyframes thumbIn { from { opacity:0; transform:scale(0.8) translateY(10px); } to { opacity:1; transform:scale(1); } }

  #flash { position: fixed; inset: 0; z-index: 200; background: white; opacity: 0; pointer-events: none; }

  /* ── A note left on the glass, shown as a photo card that stays ── */
  #noteCard {
    position: fixed; inset: 0; z-index: 210; display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.55); backdrop-filter: blur(4px);
    opacity: 0; transition: opacity 0.35s; pointer-events: none;
  }
  #noteCard.show { opacity: 1; pointer-events: auto; }
  #noteCard .note-inner {
    background: #fff; padding: 12px 12px 14px; border-radius: 6px;
    box-shadow: 0 24px 70px rgba(0,0,0,0.55); max-width: min(86vw, 460px);
    transform: scale(0.94) rotate(-1.5deg); transition: transform 0.35s;
  }
  #noteCard.show .note-inner { transform: scale(1) rotate(-1.5deg); }
  #noteCard .note-tag {
    font-family: 'Pretendard', sans-serif; font-weight: 700; font-size: 12px;
    letter-spacing: 0.06em; color: #b0607a; text-align: center; padding: 4px 0 10px;
  }
  #noteCard.live .note-tag::after { content: ' · ● LIVE'; color: #d0356a; font-size: 10px; letter-spacing: 0.1em; }
  #noteCard img { display: block; width: 100%; border-radius: 3px; }
  #noteCard .note-actions { display: flex; gap: 8px; justify-content: center; margin-top: 12px; }
  #noteCard .note-actions button {
    font-family: 'Pretendard', sans-serif; font-weight: 700; font-size: 11px; letter-spacing: 0.08em;
    text-transform: uppercase; padding: 7px 14px; border-radius: 5px; cursor: pointer;
    border: 1px solid rgba(0,0,0,0.15); background: #f3f3f3; color: #333; transition: all 0.15s;
  }
  #noteCard .note-actions button:hover { background: #e6e6e6; }

  /* ── Long-distance: photos shared from partner ── */
  .photo-thumb.partner { border-color: rgba(150,190,225,0.85); }
  .photo-thumb .heart {
    position: absolute; top: 2px; left: 3px; font-size: 11px;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,0.6)); pointer-events: none;
  }

  /* ── Long-distance: connection lobby ── */
  #lobby {
    position: fixed; inset: 0; z-index: 300; cursor: auto;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.72); backdrop-filter: blur(10px);
    transition: opacity 0.3s; font-family: 'Pretendard', sans-serif;
  }
  .lobby-card {
    width: min(90vw, 360px); padding: 28px 26px; border-radius: 16px;
    background: rgba(20,24,28,0.92); border: 1px solid rgba(255,255,255,0.12);
    color: #fff; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .lobby-card h1 { font-size: 20px; font-weight: 700; letter-spacing: 0.02em; }
  .lobby-card h1 span { color: rgba(180,205,225,0.9); font-weight: 500; }
  .lobby-card .sub { margin-top: 6px; font-size: 12px; color: rgba(255,255,255,0.5); line-height: 1.5; }
  .lobby-card label {
    display: block; font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase;
    color: rgba(255,255,255,0.45); margin-bottom: 6px;
  }
  .lobby-card .mycode { margin-top: 22px; }
  .lobby-card .code {
    font-size: 22px; font-weight: 700; letter-spacing: 0.06em; color: #cfe0ec;
    background: rgba(255,255,255,0.06); border: 1px dashed rgba(255,255,255,0.2);
    border-radius: 8px; padding: 10px; user-select: all;
  }
  .lobby-card button {
    margin-top: 10px; background: rgba(210,225,235,0.14); border: 1px solid rgba(255,255,255,0.25);
    color: #fff; padding: 9px 16px; border-radius: 8px; font-size: 12px; cursor: pointer;
    font-family: inherit; font-weight: 700; letter-spacing: 0.04em; transition: all 0.15s;
  }
  .lobby-card button:hover { background: rgba(210,225,235,0.28); }
  .lobby-card .or { margin: 18px 0 12px; font-size: 11px; color: rgba(255,255,255,0.35); letter-spacing: 0.1em; }
  .lobby-card .join { display: flex; gap: 8px; }
  .lobby-card .join input {
    flex: 1; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.2);
    color: #fff; padding: 10px; border-radius: 8px; font-size: 14px; font-family: inherit; outline: none;
  }
  .lobby-card .join input::placeholder { color: rgba(255,255,255,0.35); }
  .lobby-card .join button { margin-top: 0; }
  .lobby-card .solo {
    display: block; width: 100%; margin-top: 18px;
    background: transparent; border: none; color: rgba(255,255,255,0.4); font-weight: 500;
  }
  .lobby-card .solo:hover { color: rgba(255,255,255,0.7); background: transparent; }
  .lobby-card .hint {
    margin-top: 12px; font-size: 11px; color: rgba(255,255,255,0.45); line-height: 1.6;
  }
  .lobby-card .hint b { color: rgba(180,205,225,0.9); font-weight: 700; }
  .lobby-card .netstatus {
    margin-top: 14px; font-size: 11px; color: rgba(180,205,225,0.85);
    min-height: 14px; letter-spacing: 0.03em; line-height: 1.4;
  }

  #connBadge {
    position: fixed; top: 20px; left: 20px; z-index: 56; display: none;
    background: rgba(0,0,0,0.5); border: 1px solid rgba(210,225,235,0.4);
    color: rgba(255,255,255,0.9); padding: 7px 12px; border-radius: 20px;
    font-size: 11px; font-family: 'Pretendard', sans-serif; font-weight: 700;
    letter-spacing: 0.08em; backdrop-filter: blur(6px);
  }
  @keyframes badgePulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(210,225,235,0); }
    50%      { box-shadow: 0 0 16px 2px rgba(210,225,235,0.4); }
  }
  #connBadge.together { border-color: rgba(210,225,235,0.65); animation: badgePulse 2.6s ease-in-out infinite; }
  #connBadge.away { border-color: rgba(255,180,185,0.45); color: rgba(255,222,224,0.9); animation: none; }

  /* ── Mobile / small screens ── */
  @media (max-width: 600px) {
    #btnGroup { top: 12px; right: 12px; gap: 6px; }
    #btnGroup button { padding: 7px 10px; font-size: 10px; letter-spacing: 0.06em; }
    #connBadge { top: 12px; left: 12px; font-size: 10px; padding: 6px 10px; }
    #status { bottom: 148px; font-size: 10px; letter-spacing: 0.12em; }
    #breathRing { bottom: 100px; width: 40px; height: 40px; }
    .lobby-card { padding: 24px 20px; }
    #photoStrip { height: 72px; gap: 6px; padding: 6px 10px; }
    .photo-thumb { height: 56px; }
    #noteCard .note-inner { padding: 10px 10px 12px; }
  }
  @media (hover: none) {
    /* touch devices have no hover — keep the photo save affordance visible */
    .photo-thumb .save-btn { opacity: 0; }
    .photo-thumb:active .save-btn { opacity: 1; }
  }
</style>
</head>
<body>
<div id="container">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="cameraCanvas"></canvas>
  <canvas id="maskCanvas"></canvas>
  <canvas id="blurCanvas"></canvas>
  <canvas id="frameCanvas"></canvas>
  <canvas id="fxCanvas"></canvas>
</div>
<div id="cursor"></div>
<div id="status">initializing…</div>
<div id="breathRing"></div>
<div id="countdown"></div>
<div id="btnGroup">
  <button id="leaveBtn">💌 for you</button>
  <button id="undoBtn">↩ undo</button>
  <button id="clearBtn">✕ clear</button>
</div>
<div id="photoStrip"></div>
<div id="flash"></div>

<div id="noteCard" hidden>
  <div class="note-inner">
    <div class="note-tag">💌 left for you</div>
    <img id="noteImg" alt="a note left for you" />
    <div class="note-actions">
      <button id="noteSave">↓ save</button>
      <button id="noteClose">✕ close</button>
    </div>
  </div>
</div>

<div id="connBadge">💙 connected</div>
<div id="lobby">
  <div class="lobby-card">
    <h1>Fogether<span> · for two</span></h1>
    <p class="sub">Fog up the same glass and<br>wipe it clear, together</p>
    <div class="mycode">
      <label>Room name</label>
      <div class="join">
        <input id="roomInput" placeholder="Room name" autocomplete="off" autocapitalize="off" spellcheck="false" />
        <button id="enterBtn">Enter</button>
      </div>
      <p class="hint">Enter the <b>same room name</b> on both sides to connect.<br>Send this name to your partner.</p>
    </div>
    <button id="soloBtn" class="solo">Use solo</button>
    <div class="netstatus" id="netStatus"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
<!-- Trystero: serverless P2P rooms (no backend). If the default 'nostr' relays
     are ever flaky, swap the import path below to /mqtt or /torrent — one line. -->
<script type="module">
  import { joinRoom } from 'https://esm.sh/trystero@0.21.5/nostr';
  window.__joinRoom = joinRoom;
  if (window.__onTrysteroReady) window.__onTrysteroReady();
</script>
<script>
const video        = document.getElementById('video');
const cameraCanvas = document.getElementById('cameraCanvas');
const maskCanvas   = document.getElementById('maskCanvas');
const blurCanvas   = document.getElementById('blurCanvas');
const frameCanvas  = document.getElementById('frameCanvas');
const fxCanvas     = document.getElementById('fxCanvas');
const camCtx       = cameraCanvas.getContext('2d');
const maskCtx      = maskCanvas.getContext('2d');
const blurCtx      = blurCanvas.getContext('2d');
const frameCtx     = frameCanvas.getContext('2d');
const fxCtx        = fxCanvas.getContext('2d');
const cursor       = document.getElementById('cursor');
const statusEl     = document.getElementById('status');
const breathRing   = document.getElementById('breathRing');
const flashEl      = document.getElementById('flash');
const countdownEl  = document.getElementById('countdown');
const photoStrip   = document.getElementById('photoStrip');

const offscreen = document.createElement('canvas');
const offCtx    = offscreen.getContext('2d');

let W = 0, H = 0, fogReady = false;

// ── Status (with transient priority hold) ────────────────────────────
let statusHoldUntil = 0;
function setStatus(text, holdMs = 0) {
  if (holdMs) {
    statusEl.textContent = text;
    statusHoldUntil = Date.now() + holdMs;
  } else if (Date.now() >= statusHoldUntil) {
    statusEl.textContent = text;
  }
}

// ── Resize ────────────────────────────────────────────────────────────
function resize() {
  W = window.innerWidth; H = window.innerHeight;
  [cameraCanvas, maskCanvas, blurCanvas, frameCanvas, fxCanvas].forEach(c => { c.width = W; c.height = H; });
  offscreen.width = W; offscreen.height = H;
}
window.addEventListener('resize', resize);

// ── Render ────────────────────────────────────────────────────────────
// Draw the camera as "cover" (preserve aspect, crop overflow) instead of
// stretching it to the window — otherwise faces distort when the window
// aspect ratio differs from the camera's (esp. narrow desktop / portrait phone).
function videoCoverRect() {
  const vw = video.videoWidth, vh = video.videoHeight;
  if (!vw || !vh) return { sx: 0, sy: 0, sw: vw, sh: vh };
  const vAsp = vw / vh, cAsp = W / H;
  let sw, sh;
  if (vAsp > cAsp) { sh = vh; sw = vh * cAsp; } else { sw = vw; sh = vw / cAsp; }
  return { sx: (vw - sw) / 2, sy: (vh - sh) / 2, sw, sh };
}

function render() {
  requestAnimationFrame(render);
  if (video.readyState < 2) return;
  const r = videoCoverRect();
  camCtx.save(); camCtx.translate(W, 0); camCtx.scale(-1, 1);
  camCtx.drawImage(video, r.sx, r.sy, r.sw, r.sh, 0, 0, W, H); camCtx.restore();
  offCtx.save();
  offCtx.filter = 'blur(14px) brightness(1.05)';
  offCtx.translate(W, 0); offCtx.scale(-1, 1);
  offCtx.drawImage(video, r.sx, r.sy, r.sw, r.sh, 0, 0, W, H); offCtx.restore();
  offCtx.fillStyle = 'rgba(205,218,228,0.35)';
  offCtx.fillRect(0, 0, W, H);
  blurCtx.clearRect(0, 0, W, H);
  blurCtx.drawImage(offscreen, 0, 0);
  blurCtx.globalCompositeOperation = 'destination-in';
  blurCtx.drawImage(maskCanvas, 0, 0);
  blurCtx.globalCompositeOperation = 'source-over';
}

// ── Partner feedback FX (their breath bloom + wipe cursor) ────────────
// Drawn on its own overlay in an independent loop so the "someone's here"
// cues stay alive even before the camera frame is ready.
let partnerBlooms = [];    // { x, y, born }
let partnerCursor = null;  // { x, y, ts }

function addPartnerBloom(nx, ny) {
  partnerBlooms.push({ x: nx * W, y: ny * H, born: Date.now() });
  if (partnerBlooms.length > 16) partnerBlooms.shift();
}

function renderFx() {
  requestAnimationFrame(renderFx);
  if (!W || !H) return;
  fxCtx.clearRect(0, 0, W, H);
  const now = Date.now();

  // partner's breath — soft ripple that blooms then fades
  const LIFE = 1500;
  partnerBlooms = partnerBlooms.filter(b => now - b.born < LIFE);
  for (const b of partnerBlooms) {
    const t = (now - b.born) / LIFE;      // 0 → 1
    const r = 30 + t * 170;
    const a = (1 - t) * 0.5;
    const g = fxCtx.createRadialGradient(b.x, b.y, 0, b.x, b.y, r);
    g.addColorStop(0,    'rgba(210,225,235,0)');
    g.addColorStop(0.72, `rgba(210,225,235,${a * 0.5})`);
    g.addColorStop(0.87, `rgba(232,242,250,${a})`);
    g.addColorStop(1,    'rgba(210,225,235,0)');
    fxCtx.beginPath(); fxCtx.arc(b.x, b.y, r, 0, Math.PI * 2); fxCtx.fillStyle = g; fxCtx.fill();
  }

  // partner's wiping hand — a faint warm glow that trails their finger
  if (partnerCursor) {
    const age = now - partnerCursor.ts;
    if (age < 550) {
      const a = (1 - age / 550) * 0.85;
      const { x, y } = partnerCursor;
      const g = fxCtx.createRadialGradient(x, y, 0, x, y, 18);
      g.addColorStop(0, `rgba(255,188,203,${a})`);
      g.addColorStop(1, 'rgba(255,188,203,0)');
      fxCtx.beginPath(); fxCtx.arc(x, y, 18, 0, Math.PI * 2); fxCtx.fillStyle = g; fxCtx.fill();
    } else {
      partnerCursor = null;
    }
  }
}
renderFx();

// ── Fog ───────────────────────────────────────────────────────────────
const FOG_COOLDOWN_MS = 1000; // keep a wiped/breathed-on area stable for ~1s before new fog can land on it
const FOG_LIFETIME_MS = 60000; // fog fades itself out ~1 min after the last breath
let nextFogAllowedAt = 0;
let fogFadeTimer = null;

function scheduleFogFade() {
  clearTimeout(fogFadeTimer);
  fogFadeTimer = setTimeout(() => { resetFog(); setStatus('blow on the screen'); }, FOG_LIFETIME_MS);
}

// Fog blobs are generated in normalized (0..1) coords so a breath looks the
// same on both partners' screens regardless of their window size.
function generateFogBlobs(intensity) {
  const blobs = [];
  const n = 3 + Math.floor(Math.random()*3);
  for (let i = 0; i < n; i++) {
    const cx = W*0.5 + (Math.random()-0.5)*W*0.6;
    const cy = H*0.5 + (Math.random()-0.5)*H*0.3;
    const r  = 100 + Math.random()*200 + intensity*600;
    const a  = Math.min(1, 0.4 + intensity*4);
    blobs.push({ nx: cx/W, ny: cy/H, nr: r/W, a });
  }
  return blobs;
}

function paintFogBlobs(blobs) {
  for (const b of blobs) {
    const cx = b.nx*W, cy = b.ny*H, r = b.nr*W, a = b.a;
    const g = maskCtx.createRadialGradient(cx,cy,0,cx,cy,r);
    g.addColorStop(0, `rgba(255,255,255,${a})`);
    g.addColorStop(0.5, `rgba(255,255,255,${a*0.65})`);
    g.addColorStop(1, `rgba(255,255,255,0)`);
    maskCtx.save();
    maskCtx.globalCompositeOperation = 'source-over';
    maskCtx.fillStyle = g;
    maskCtx.beginPath(); maskCtx.arc(cx,cy,r,0,Math.PI*2); maskCtx.fill();
    maskCtx.restore();
  }
}

// Land a set of fog blobs on the shared glass (local breath OR partner's breath).
function landFog(blobs) {
  fogReady = true;
  scheduleFogFade();
  paintFogBlobs(blobs);
  if (!countingDown) setStatus('pinch to draw');
}

function addFog(intensity) {
  const now = Date.now();
  if (now < nextFogAllowedAt) return;
  nextFogAllowedAt = now + FOG_COOLDOWN_MS;
  const blobs = generateFogBlobs(intensity);
  landFog(blobs);
  netSend({ t: 'fog', b: blobs });
}

// ── Draw ──────────────────────────────────────────────────────────────
let smoothX = null, smoothY = null;
const SMOOTH = 0.4;
let trail = [], lastDrawX = null, lastDrawY = null;

// Wipe a smoothed trail into the fog. Shared by the local hand and the partner's.
function strokeTrailOn(ctx, tr) {
  if (tr.length < 2) return;
  ctx.save();
  ctx.globalCompositeOperation = 'destination-out';
  ctx.strokeStyle = 'rgba(0,0,0,1)';
  ctx.lineWidth = 40; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath();
  if (tr.length === 2) {
    ctx.moveTo(tr[0].x, tr[0].y);
    ctx.lineTo(tr[1].x, tr[1].y);
  } else {
    ctx.moveTo((tr[0].x+tr[1].x)/2, (tr[0].y+tr[1].y)/2);
    for (let i = 1; i < tr.length-1; i++) {
      ctx.quadraticCurveTo(tr[i].x, tr[i].y,
        (tr[i].x+tr[i+1].x)/2, (tr[i].y+tr[i+1].y)/2);
    }
  }
  ctx.stroke(); ctx.restore();
}

let localWiping = false;
function eraseAt(rawX, rawY) {
  if (smoothX === null) { smoothX = rawX; smoothY = rawY; }
  smoothX += SMOOTH * (rawX - smoothX);
  smoothY += SMOOTH * (rawY - smoothY);
  const x = smoothX, y = smoothY;
  lastDrawX = x; lastDrawY = y;
  trail.push({x, y}); if (trail.length > 6) trail.shift();
  strokeTrailOn(maskCtx, trail);
  localWiping = true;
  netSend({ t: 'wipe', x: x/W, y: y/H });
}

// Partner's wipe replays into the same mask, on its own trail.
let remoteTrail = [];
function onRemoteWipe(nx, ny) {
  remoteTrail.push({ x: nx*W, y: ny*H }); if (remoteTrail.length > 6) remoteTrail.shift();
  strokeTrailOn(maskCtx, remoteTrail);
  partnerCursor = { x: nx*W, y: ny*H, ts: Date.now() };
}
function onRemoteWipeEnd() { remoteTrail = []; }

function resetDraw() {
  if (localWiping) { localWiping = false; netSend({ t: 'wipeEnd' }); captureStrokeClip(); }
  smoothX = null; smoothY = null;
  trail = []; lastDrawX = null; lastDrawY = null;
}

// ── Live note: a rolling ~1s buffer of the glass while you're drawing ──
// Like an iPhone Live Photo — we keep the last second of frames so a note
// can play back the moment you drew it, not just the final still.
const LIVE_MS = 1000, LIVE_STEP_MS = 90, LIVE_W = 320;
let liveBuffer = [];        // { t, url } rolling window of recent frames
let lastLiveCapture = 0;
let lastStrokeClip = null;  // frames[] captured at the end of the most recent stroke

function recordLiveFrame() {
  const now = Date.now();
  if (now - lastLiveCapture < LIVE_STEP_MS) return;
  lastLiveCapture = now;
  liveBuffer.push({ t: now, url: composeGlass(LIVE_W).toDataURL('image/jpeg', 0.5) });
  const cutoff = now - LIVE_MS - 250;
  while (liveBuffer.length && liveBuffer[0].t < cutoff) liveBuffer.shift();
}
function captureStrokeClip() {
  const now = Date.now();
  const frames = liveBuffer.filter(f => f.t >= now - LIVE_MS).map(f => f.url);
  if (frames.length >= 2) lastStrokeClip = frames;
}

// ── Undo ──────────────────────────────────────────────────────────────
let undoStack = [], isDrawingStroke = false;
function saveSnapshot() {
  undoStack.push(maskCtx.getImageData(0, 0, W, H));
  if (undoStack.length > 20) undoStack.shift();
}
function undo() {
  if (!undoStack.length) return;
  maskCtx.putImageData(undoStack.pop(), 0, 0);
}

// ── Fog reset (used by the clear button, and by the auto-fade timeout) ─
function resetFog() {
  clearTimeout(fogFadeTimer);
  maskCtx.clearRect(0, 0, W, H);
  fogReady = false;
  resetDraw();
}

// ── Capture ───────────────────────────────────────────────────────────
const HOLD_MS = 1500;
let holdStart = null, countingDown = false, countTimer = null;

function isLShape(lm) {
  return lm[8].y < lm[6].y &&
         Math.abs(lm[4].x - lm[2].x) > 0.04 &&
         lm[12].y > lm[10].y &&
         lm[16].y > lm[14].y;
}

function drawCaptureFrame(lm1, lm2, progress) {
  frameCtx.clearRect(0, 0, W, H);
  const x1=(1-lm1[8].x)*W, y1=lm1[8].y*H;
  const x2=(1-lm2[8].x)*W, y2=lm2[8].y*H;
  const left=Math.min(x1,x2), right=Math.max(x1,x2);
  const top=Math.min(y1,y2), bottom=top+(right-left)*0.75;
  const cLen=(right-left)*0.18;
  frameCtx.strokeStyle = `rgba(255,255,255,${0.5+progress*0.5})`;
  frameCtx.lineWidth = 2+progress*1.5; frameCtx.lineCap = 'square';
  [[left,top+cLen,left,top,left+cLen,top],
   [right-cLen,top,right,top,right,top+cLen],
   [left,bottom-cLen,left,bottom,left+cLen,bottom],
   [right-cLen,bottom,right,bottom,right,bottom-cLen]
  ].forEach(([x1,y1,x2,y2,x3,y3]) => {
    frameCtx.beginPath();
    frameCtx.moveTo(x1,y1); frameCtx.lineTo(x2,y2); frameCtx.lineTo(x3,y3);
    frameCtx.stroke();
  });
}

function startCountdown() {
  countingDown = true;
  let count = 3;
  countdownEl.textContent = count;
  countdownEl.classList.add('show');
  setStatus('get ready…');
  countTimer = setInterval(() => {
    count--;
    if (count > 0) {
      countdownEl.textContent = count;
    } else {
      clearInterval(countTimer);
      countdownEl.classList.remove('show');
      countdownEl.textContent = '';
      countingDown = false;
      doCapture();
    }
  }, 1000);
}

function doCapture() {
  flashEl.style.transition = 'none';
  flashEl.style.opacity = '0.9';
  setTimeout(() => { flashEl.style.transition = 'opacity 0.3s'; flashEl.style.opacity = '0'; }, 80);
  const snap = document.createElement('canvas');
  snap.width = W; snap.height = H;
  const sCtx = snap.getContext('2d');
  sCtx.drawImage(cameraCanvas, 0, 0);
  sCtx.drawImage(blurCanvas, 0, 0);
  snap.toBlob(blob => {
    addPhotoThumb(URL.createObjectURL(blob), false);
    sharePhoto(snap);
    frameCtx.clearRect(0, 0, W, H);
    holdStart = null;
    setStatus(fogReady ? 'pinch to draw' : 'blow on the screen');
  }, 'image/png');
}

// Add one photo to the strip. `fromPartner` marks it as the other person's shot.
function addPhotoThumb(url, fromPartner) {
  const wrap = document.createElement('div');
  wrap.className = 'photo-thumb' + (fromPartner ? ' partner' : '');
  const img = document.createElement('img');
  img.src = url;
  const btn = document.createElement('div');
  btn.className = 'save-btn';
  btn.textContent = '↓ save';
  btn.addEventListener('click', e => {
    e.stopPropagation();
    const a = document.createElement('a');
    a.href = url; a.download = `fogether-${Date.now()}.png`; a.click();
  });
  wrap.appendChild(img); wrap.appendChild(btn);
  if (fromPartner) {
    const h = document.createElement('div');
    h.className = 'heart'; h.textContent = '💙';
    wrap.appendChild(h);
  }
  photoStrip.appendChild(wrap);
  wrap.scrollIntoView({ behavior: 'smooth', inline: 'end' });
}

// Send a small (downscaled) copy of a captured photo to the partner.
function sharePhoto(sourceCanvas) {
  if (!sendPic || !connected) return;
  const sw = 640, sh = Math.max(1, Math.round(sw * H / W));
  const c = document.createElement('canvas'); c.width = sw; c.height = sh;
  c.getContext('2d').drawImage(sourceCanvas, 0, 0, sw, sh);
  c.toBlob(b => {
    if (!b) return;
    b.arrayBuffer().then(buf => sendPic(new Uint8Array(buf)));
  }, 'image/jpeg', 0.7);
}

// ── Hands ─────────────────────────────────────────────────────────────
const hands = new Hands({ locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}` });
hands.setOptions({ maxNumHands:2, modelComplexity:1, minDetectionConfidence:0.6, minTrackingConfidence:0.5 });

hands.onResults(results => {
  const all = results.multiHandLandmarks || [];

  // DRAW
  if (all.length >= 1 && !countingDown) {
    const lm = all[0];
    const fx = (1-lm[8].x)*W, fy = lm[8].y*H;
    const tx = (1-lm[4].x)*W, ty = lm[4].y*H;
    const pinching = Math.hypot(fx-tx, fy-ty) < W*0.055;
    cursor.style.left = fx+'px'; cursor.style.top = fy+'px'; cursor.style.opacity = '1';
    if (pinching && fogReady) {
      holdStart = null; frameCtx.clearRect(0,0,W,H);
      cursor.classList.add('drawing');
      if (!isDrawingStroke) { saveSnapshot(); isDrawingStroke = true; }
      eraseAt(fx, fy);
      recordLiveFrame();
      setStatus('drawing…');
      return;
    } else {
      cursor.classList.remove('drawing');
      isDrawingStroke = false; resetDraw();
    }
  } else if (!countingDown) {
    cursor.style.opacity = '0';
    isDrawingStroke = false; resetDraw();
  }

  // CAPTURE
  if (!countingDown) {
    const bothL = all.length === 2 && isLShape(all[0]) && isLShape(all[1]);
    if (bothL) {
      if (!holdStart) holdStart = Date.now();
      const elapsed = Date.now() - holdStart;
      drawCaptureFrame(all[0], all[1], Math.min(elapsed/HOLD_MS, 1));
      setStatus('📷 hold…');
      if (elapsed >= HOLD_MS) { holdStart = null; frameCtx.clearRect(0,0,W,H); startCountdown(); }
    } else {
      if (holdStart) { holdStart = null; frameCtx.clearRect(0,0,W,H); }
      if (!fogReady) setStatus('blow on the screen');
      else if (all.length >= 1) setStatus('pinch to draw');
    }
  }
});

// ── Face (mouth-open breath detection) ───────────────────────────────
// Replaces mic-based detection: opening your mouth (as if blowing) fogs
// the mirror instead of any ambient sound/talking triggering it.
const MOUTH_OPEN_THRESHOLD = 0.35; // vertical lip gap / mouth width; raise if it over-triggers, lower if it under-triggers
const faceMesh = new FaceMesh({ locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${f}` });
faceMesh.setOptions({ maxNumFaces:4, refineLandmarks:false, minDetectionConfidence:0.6, minTrackingConfidence:0.5 });

function mouthOpenRatio(lm) {
  const vertical   = Math.hypot(lm[13].x - lm[14].x, lm[13].y - lm[14].y);
  const horizontal = Math.hypot(lm[61].x - lm[291].x, lm[61].y - lm[291].y);
  return horizontal > 0 ? vertical / horizontal : 0;
}

// Track every tracked face, not just one — anyone in frame blowing
// (e.g. a group in front of the mirror) fogs it up, not only one person.
let mouthOpenTO = null;
faceMesh.onResults(results => {
  const faces = results.multiFaceLandmarks || [];
  if (!faces.length) return;
  const openRatios = faces.map(mouthOpenRatio).filter(r => r > MOUTH_OPEN_THRESHOLD);
  if (openRatios.length) {
    const maxRatio = Math.max(...openRatios);
    addFog(Math.min(1, (maxRatio - MOUTH_OPEN_THRESHOLD) / 0.3) * 0.05);
    breathRing.classList.add('active');
    clearTimeout(mouthOpenTO); mouthOpenTO = setTimeout(() => breathRing.classList.remove('active'), 300);
  }
});

// ── Camera ────────────────────────────────────────────────────────────
async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { width:{ideal:1280}, height:{ideal:720}, facingMode:'user' }, audio: false
    });
    video.srcObject = stream; await video.play();
    const mpCam = new Camera(video, {
      onFrame: async () => {
        await hands.send({ image: video });
        await faceMesh.send({ image: video });
      },
      width: 1280, height: 720
    });
    mpCam.start(); resize(); render();
    setStatus('blow on the screen');
  } catch(e) { setStatus('camera access needed'); }
}

// ── Buttons ───────────────────────────────────────────────────────────
document.getElementById('leaveBtn').addEventListener('click', leaveNote);
document.getElementById('noteClose').addEventListener('click', () => {
  const c = document.getElementById('noteCard'); c.classList.remove('show'); stopLivePlayback(); setTimeout(() => { c.hidden = true; }, 350);
});
document.getElementById('noteSave').addEventListener('click', () => {
  const a = document.createElement('a');
  a.href = document.getElementById('noteCard').dataset.url || '';
  a.download = 'fogether-' + Date.now() + '.jpg'; a.click();
});
document.getElementById('undoBtn').addEventListener('click', undo);
document.getElementById('clearBtn').addEventListener('click', () => {
  resetFog();
  undoStack = [];
  setStatus('blow on the screen');
  netSend({ t: 'clear' });
});

// ── Long-distance networking (Trystero: serverless P2P rooms) ─────────
// Each person keeps their own camera; only breath / wipe / clear / photo
// events cross the wire, so it feels like one pane of glass between you.
// Both partners join the SAME room name — no host, no signaling server.
let room = null, sendSig = null, sendPic = null, sendNote = null;
let connected = false, pendingCode = null, currentRoom = null, savedNote = null;
const lobbyEl    = document.getElementById('lobby');
const roomInput  = document.getElementById('roomInput');
const netStatus  = document.getElementById('netStatus');
const connBadge  = document.getElementById('connBadge');

function netSend(obj) { if (sendSig) { try { sendSig(obj); } catch (e) {} } }
function setNetStatus(t) { if (netStatus) netStatus.textContent = t; }

function onPeerConnected() {
  connected = true;
  connBadge.textContent = '💙 here together';
  connBadge.classList.add('together');
  connBadge.classList.remove('away');
  connBadge.style.display = 'block';
  lobbyEl.style.opacity = '0';
  setTimeout(() => { lobbyEl.style.display = 'none'; }, 300);
  // deliver whatever I last left on the glass for this room
  if (sendNote && savedNote) sendNote(savedNote);
}

// Called once Trystero's module has loaded, in case the user clicked first.
window.__onTrysteroReady = () => {
  if (pendingCode) { const c = pendingCode; pendingCode = null; joinBreathRoom(c); }
};

function joinBreathRoom(code) {
  if (!window.__joinRoom) { pendingCode = code; setNetStatus('getting ready… one moment'); return; }
  if (room) { try { room.leave(); } catch (e) {} }
  currentRoom = code;
  savedNote = loadSavedNote(code);   // a note I left here before, to hand over on connect
  cloudFetchNote(code).then(showCloudNote);   // a note waiting for me from before
  setNetStatus('waiting for your partner…');
  room = window.__joinRoom({ appId: 'breath-mirror-longdistance' }, code);
  const sig  = room.makeAction('sig');  sendSig  = sig[0];  sig[1](data => handleData(data));
  const pic  = room.makeAction('pic');  sendPic  = pic[0];  pic[1](data => onRemotePhoto(data));
  const note = room.makeAction('note'); sendNote = note[0]; note[1](data => onRemoteNote(data));
  room.onPeerJoin(() => onPeerConnected());
  room.onPeerLeave(() => {
    connected = false;
    connBadge.textContent = '· away for now';
    connBadge.classList.remove('together');
    connBadge.classList.add('away');
  });
}

function handleData(msg) {
  switch (msg && msg.t) {
    case 'fog':
      landFog(msg.b);
      breathRing.classList.add('active');
      clearTimeout(mouthOpenTO);
      mouthOpenTO = setTimeout(() => breathRing.classList.remove('active'), 300);
      // bloom a soft ripple at the centre of where they breathed
      if (msg.b && msg.b.length) {
        let sx = 0, sy = 0;
        for (const b of msg.b) { sx += b.nx; sy += b.ny; }
        addPartnerBloom(sx / msg.b.length, sy / msg.b.length);
      }
      break;
    case 'wipe':    onRemoteWipe(msg.x, msg.y); break;
    case 'wipeEnd': onRemoteWipeEnd(); break;
    case 'clear':   resetFog(); setStatus('blow on the screen'); break;
  }
}

function onRemotePhoto(data) {
  const bytes = data instanceof Uint8Array ? data : new Uint8Array(data);
  addPhotoThumb(URL.createObjectURL(new Blob([bytes], { type: 'image/jpeg' })), true);
}

// ── Notes left on the glass (handwriting / hearts) ───────────────────
// A "note" is the fog+writing mask itself, so the partner sees exactly the
// shape you left. Kept as a PNG data URL and delivered three ways:
//   • live over P2P (if you're both online right now)
//   • saved on this device (localStorage, per room)
//   • saved to a tiny cloud store so they see it even if you're offline
// ↓↓↓ PASTE YOUR FIREBASE REALTIME DATABASE URL BETWEEN THE QUOTES ↓↓↓
const FIREBASE_DB_URL = 'https://breath-mirror-62e17-default-rtdb.asia-southeast1.firebasedatabase.app';
// ↑↑↑ leave '' and notes still work over P2P + this device (just not offline) ↑↑↑

function myDeviceId() {
  let id = null;
  try {
    id = localStorage.getItem('bm-myid');
    if (!id) { id = 'u-' + Math.random().toString(36).slice(2, 10); localStorage.setItem('bm-myid', id); }
  } catch (e) {}
  return id || 'anon';
}

// Compose the current glass — your face behind the frosted writing — into a photo.
function composeGlass(maxW) {
  const scale = maxW ? Math.min(1, maxW / W) : 1;
  const sw = Math.max(1, Math.round(W * scale)), sh = Math.max(1, Math.round(H * scale));
  const c = document.createElement('canvas'); c.width = sw; c.height = sh;
  const cx = c.getContext('2d');
  cx.drawImage(cameraCanvas, 0, 0, sw, sh);
  cx.drawImage(blurCanvas, 0, 0, sw, sh);
  return c;
}

// Parse a stored note: JSON payload {type,frames?,cover}, or a legacy plain dataURL.
function parseNote(data) {
  if (!data) return null;
  if (typeof data === 'object') return data;
  try { const o = JSON.parse(data); if (o && (o.cover || o.frames)) return o; } catch (e) {}
  return { type: 'still', cover: data };
}

let liveTimer = null;
function stopLivePlayback() { if (liveTimer) { clearInterval(liveTimer); liveTimer = null; } }
function playLive(img, frames) {
  let i = 0; img.src = frames[0];
  liveTimer = setInterval(() => { i = (i + 1) % frames.length; img.src = frames[i]; }, LIVE_STEP_MS);
}

// Show a received note as a card that STAYS until dismissed (no fade).
// A "live" note loops its last second like an iPhone Live Photo.
function showNoteCard(data) {
  const note = parseNote(data);
  if (!note) return;
  const card = document.getElementById('noteCard');
  const img = document.getElementById('noteImg');
  stopLivePlayback();
  if (note.type === 'live' && note.frames && note.frames.length >= 2) {
    card.dataset.url = note.cover || note.frames[note.frames.length - 1];
    card.classList.add('live');
    playLive(img, note.frames);
  } else {
    card.dataset.url = note.cover;
    card.classList.remove('live');
    img.src = note.cover;
  }
  card.hidden = false;
  setTimeout(() => card.classList.add('show'), 20);
  setStatus('💌 left for you', 3500);
}
function loadSavedNote(room) {
  try { return localStorage.getItem('bm-note-' + room) || null; } catch (e) { return null; }
}

// P2P: partner handed me their note live
function onRemoteNote(dataURL) { showNoteCard(dataURL); }

// Cloud: read/write the room's latest note (works even with no one online)
function cloudSaveNote(room, dataURL) {
  if (!FIREBASE_DB_URL) return Promise.resolve(false);
  const payload = JSON.stringify({ data: dataURL, ts: Date.now(), from: myDeviceId() });
  return fetch(FIREBASE_DB_URL + '/notes/' + encodeURIComponent(room) + '.json', { method: 'PUT', body: payload })
    .then(r => r.ok).catch(() => false);
}
function cloudFetchNote(room) {
  if (!FIREBASE_DB_URL) return Promise.resolve(null);
  return fetch(FIREBASE_DB_URL + '/notes/' + encodeURIComponent(room) + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
}
function showCloudNote(note) {
  if (!note || !note.data || note.from === myDeviceId()) return;   // nothing, or my own
  const seenKey = 'bm-noteseen-' + (currentRoom || '');
  let lastSeen = 0; try { lastSeen = +(localStorage.getItem(seenKey) || 0); } catch (e) {}
  if (note.ts && note.ts <= lastSeen) return;                      // already shown before
  showNoteCard(note.data);
  try { localStorage.setItem(seenKey, String(note.ts || Date.now())); } catch (e) {}
}

function leaveNote() {
  if (!fogReady) { setStatus('write on the glass first', 2000); return; }
  // a "live" note if you just drew (last ~1s of frames), else a still photo
  let note = (lastStrokeClip && lastStrokeClip.length >= 2)
    ? { v: 1, type: 'live', frames: lastStrokeClip.slice(), cover: lastStrokeClip[lastStrokeClip.length - 1] }
    : { v: 1, type: 'still', cover: composeGlass(900).toDataURL('image/jpeg', 0.78) };
  let payload = JSON.stringify(note);
  // stay under the cloud size limit: thin frames first, then fall back to a still
  while (note.type === 'live' && payload.length > 380000 && note.frames.length > 3) {
    note.frames = note.frames.filter((_, i) => i % 2 === 0);
    note.cover = note.frames[note.frames.length - 1];
    payload = JSON.stringify(note);
  }
  if (payload.length > 380000) { note = { v: 1, type: 'still', cover: note.cover }; payload = JSON.stringify(note); }
  savedNote = payload;
  try { localStorage.setItem('bm-note-' + (currentRoom || 'solo'), payload); } catch (e) {}
  if (sendNote && connected) sendNote(payload);   // instant, if they're online now
  cloudSaveNote(currentRoom || 'solo', payload).then(ok => {
    const kind = note.type === 'live' ? 'live moment' : 'moment';
    setStatus(ok ? 'left a ' + kind + ' for them · anytime 💙'
                 : (connected ? 'sent to your partner 💙' : 'left on the glass 💙'), 4000);
  });
}

// Lobby controls
const enterBtn = document.getElementById('enterBtn');
enterBtn.addEventListener('click', () => {
  const code = (roomInput.value || '').trim();
  if (!code) { setNetStatus('Please enter a room name'); return; }
  joinBreathRoom(code);
});
roomInput.addEventListener('keydown', e => { if (e.key === 'Enter') enterBtn.click(); });
document.getElementById('soloBtn').addEventListener('click', () => {
  lobbyEl.style.opacity = '0';
  setTimeout(() => { lobbyEl.style.display = 'none'; }, 300);
});

// Suggest a room name so one person can just share it.
roomInput.value = 'bm-' + Math.random().toString(36).slice(2, 7);
setNetStatus('Enter the same room name on both sides, then press Enter');

startCamera();
</script>
